name: Build & Publish APK

on:
  release:
    types: [published]
  workflow_dispatch: # Erlaubt das manuelle Starten des Workflows aus dem GitHub-UI

jobs:
  build:
    name: Build APK and Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # Wir bauen eine Debug-APK. Eine Release-APK würde manuell konfigurierte Signaturschlüssel erfordern.
        # Die Debug-APK lässt sich auf jedem Android-Handy per Sideloading installieren.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact (for Action page)
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-App
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
